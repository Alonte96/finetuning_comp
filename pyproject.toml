[project]
name = "gradproj"
version = "0.1.0"
description = "Memory-matched full fine-tuning via low-rank gradient projection (GaLore), as a drop-in wrapper around any torch optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
experiments = ["transformers>=4.40", "datasets>=2.18", "peft>=0.10", "accelerate>=0.29", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradproj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
